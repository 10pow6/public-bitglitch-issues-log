name: ✨ Feature Request
description: Suggest a new Glitch, mechanic, or improvement for BitGlitch.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! ✨

        **Before you start:** please [search existing issues](https://github.com/10pow6/public-bitglitch-issues-log/issues?q=is%3Aissue) — if your idea already exists, add a 👍 or comment instead of opening a duplicate.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem or opportunity does this address?
      description: What's frustrating today, or what would make the game more fun?
      placeholder: It's hard to compare two Glitches' stats side by side before synthesizing.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Describe your idea
      description: What would you like to see? Be as specific as you can.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which area does this relate to?
      options:
        - Summoning Glitches
        - Inventory / Collection
        - Shop
        - Synthesis
        - Equipment
        - Hacks
        - Combat — PvE Arena
        - Combat — Arena PvP
        - Combat — Training Rooms
        - Daily Login / Rewards
        - TP6 / Economy
        - UI / Quality of life
        - Something new
        - Other / Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any other approaches or workarounds you've thought about. (Optional)
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Mockups, examples from other games, or extra context. (Optional)
    validations:
      required: false
